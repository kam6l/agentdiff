<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AgentDiff full-state agent evaluation preview</title>
  <desc id="desc">A dark editorial product card showing a clean agent run, state mutations, and a cleanliness score.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#050605" flood-opacity=".38"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#30342f" stroke-width="1" opacity=".42"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" rx="32" fill="#171916"/>
  <rect width="1200" height="630" rx="32" fill="url(#grid)"/>
  <circle cx="1068" cy="82" r="145" fill="#f06a3c" opacity=".13"/>
  <circle cx="89" cy="570" r="190" fill="#c9ed5a" opacity=".08"/>

  <g transform="translate(72 58)">
    <rect width="48" height="48" rx="11" fill="#f3efdf"/>
    <path d="M15 13H9v22h6M33 13h6v22h-6" fill="none" stroke="#171916" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 21h12M18 28h12" stroke="#f06a3c" stroke-width="4" stroke-linecap="round"/>
    <text x="66" y="36" fill="#f3efdf" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="750" letter-spacing="-1">AgentDiff</text>
    <text x="903" y="33" fill="#9da297" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15">FULL-STATE EVALUATION</text>
  </g>

  <text x="72" y="176" fill="#f3efdf" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="760" letter-spacing="-2.3">The output passed.</text>
  <text x="72" y="236" fill="#f06a3c" font-family="Inter,Arial,sans-serif" font-size="55" font-weight="760" letter-spacing="-2.3">Did the agent?</text>
  <text x="74" y="279" fill="#aeb3a7" font-family="Inter,Arial,sans-serif" font-size="19">Evaluate the trajectory—and everything it changed.</text>

  <g transform="translate(72 328)" filter="url(#shadow)">
    <rect width="1056" height="238" rx="20" fill="#f3efdf"/>
    <path d="M0 64H1056" stroke="#d4d0c2"/>
    <circle cx="28" cy="32" r="5" fill="#f06a3c"/>
    <circle cx="47" cy="32" r="5" fill="#d8b144"/>
    <circle cx="66" cy="32" r="5" fill="#8fb83f"/>
    <text x="91" y="38" fill="#5f635b" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14">agentdiff / run-184</text>

    <g transform="translate(26 86)">
      <text y="18" fill="#6f746a" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13">MUTATION INSPECTOR</text>
      <rect y="34" width="654" height="88" rx="12" fill="#e8e4d7"/>
      <circle cx="23" cy="59" r="7" fill="#c9ed5a"/>
      <text x="42" y="64" fill="#22241f" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15">M  src/evaluator.py</text>
      <circle cx="23" cy="94" r="7" fill="#f06a3c"/>
      <text x="42" y="99" fill="#22241f" font-family="ui-monospace,SFMono-Regular,monospace" font-size="15">+  debug.log</text>
    </g>

    <g transform="translate(735 88)">
      <text fill="#6f746a" font-family="ui-monospace,SFMono-Regular,monospace" font-size="13">CLEANLINESS</text>
      <text y="64" fill="#171916" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="780">50%</text>
      <rect y="83" width="264" height="12" rx="6" fill="#d5d1c4"/>
      <rect y="83" width="132" height="12" rx="6" fill="#f06a3c"/>
      <text y="123" fill="#9d3d21" font-family="ui-monospace,SFMono-Regular,monospace" font-size="14" font-weight="700">REVIEW SIDE EFFECTS →</text>
    </g>
  </g>
</svg>
