[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdiff"
version = "0.4.0"
description = "Deterministic proof and delivery for AI-generated code migrations"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "kam6l"}]
keywords = [
    "ai-agents",
    "api-migration",
    "code-verification",
    "developer-tools",
    "policy",
    "runtime-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "packaging>=23.0",
    "psutil>=5.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typing-extensions>=4.10",
]

[project.urls]
Homepage = "https://agentdiff.usernameort.chatgpt.site/"
Documentation = "https://agentdiff.usernameort.chatgpt.site/docs/"
Repository = "https://github.com/kam6l/agentdiff"
Issues = "https://github.com/kam6l/agentdiff/issues"

[project.optional-dependencies]
langchain = ["langchain-core>=0.3,<2"]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "types-psutil>=5.9",
    "types-PyYAML>=6.0",
]
build = [
    "build>=1.2",
    "check-wheel-contents>=0.6",
    "twine>=5.0",
]
security = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[project.scripts]
agentdiff = "agentdiff.cli:main"
agentdiff-demo = "agentdiff.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "BLE", "C4", "E", "F", "I", "PYI", "RUF", "SIM", "TC"]

[tool.mypy]
python_version = "3.12"
files = ["src/agentdiff"]
show_error_codes = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["langchain_core.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/agentdiff/evaluator.py" = ["TC001", "TC003"]
"src/agentdiff/trajectory.py" = ["TC001", "TC003"]
"tests/test_evaluator.py" = ["TC003"]
"tests/test_integrations.py" = ["TC003"]
"tests/test_policy.py" = ["TC003"]
"tests/test_snapshot_security.py" = ["TC003"]
