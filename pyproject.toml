[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentdiff"
version = "0.1.0"
description = "Full-State Trajectory Evaluation for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AI Engineer", email = "dev@example.com"}
]
keywords = ["agent", "evaluation", "trajectory", "diff", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0",
    "rich>=13.0",
    "watchdog>=4.0",
    "GitPython>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.0",
]
langchain = ["langchain-core>=0.3", "langchain>=0.3"]
crewai = ["crewai>=0.80"]
autogen = ["pyautogen>=0.2"]
all = [
    "langchain-core>=0.3",
    "langchain>=0.3",
    "crewai>=0.80",
    "pyautogen>=0.2",
]

[project.scripts]
agentdiff = "agentdiff.cli:main"
agentdiff-demo = "agentdiff.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"