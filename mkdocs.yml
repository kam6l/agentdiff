site_name: AgentDiff Runtime
site_description: Runtime evidence and conflict-safe recovery for autonomous agents
site_author: kam6l
site_url: https://kam6l.github.io/agentdiff/
repo_url: https://github.com/kam6l/agentdiff
repo_name: kam6l/agentdiff
edit_uri: edit/main/docs_src/
docs_dir: docs_src
site_dir: site

copyright: Copyright &copy; 2026 AgentDiff contributors

theme:
  name: material
  language: en
  favicon: assets/images/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.path
    - navigation.indexes
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.code.annotate
    - toc.follow
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Documentation:
      - Overview: index.md
      - Getting started:
          - Quickstart: docs/quickstart.md
          - Installation: docs/installation.md
      - Concepts:
          - Runtime Model: docs/concepts/runtime.md
          - Mutation Policy: docs/concepts/policy.md
          - Blast-Radius Scoring: docs/concepts/blast-radius.md
          - Selective Recovery: docs/concepts/recovery.md
      - CLI Reference: docs/cli.md
      - Python API: docs/api.md
      - Integrations:
          - Anthropic Sandbox Runtime: docs/integrations/sandbox-runtime.md
          - MCP Policy Hook: docs/integrations/mcp-policy.md
          - Custom Frameworks: docs/integrations/custom.md
          - LangChain / LangGraph: docs/integrations/langchain.md
  - SDK Reference: docs/sdk-reference.md
  - API Reference: docs/api-reference.md
  - Changelog: changelog.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            members_order: source
            docstring_style: google

markdown_extensions:
  - meta
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/site.js
  - javascripts/e2b-nav.js

extra:
  homepage: https://kam6l.github.io/agentdiff/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kam6l/agentdiff
      name: AgentDiff on GitHub
  version:
    provider: mike
  repo_stars: 13332