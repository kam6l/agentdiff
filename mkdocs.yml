site_name: AgentDiff
site_description: See exactly what an AI agent changed and selectively undo only the collateral damage.
site_author: kam6l
site_url: https://kam6l.github.io/agentdiff/
repo_url: https://github.com/kam6l/agentdiff
repo_name: kam6l/agentdiff
edit_uri: edit/main/docs_src/
docs_dir: docs_src
site_dir: site

copyright: Copyright &copy; 2026 AgentDiff contributors

theme:
  name: material
  custom_dir: docs_src/overrides
  language: en
  logo: assets/images/favicon.svg
  favicon: assets/images/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Use light mode
    - scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Use dark mode
  features:
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Documentation:
      - Overview: docs/index.md
      - Getting started:
          - Quickstart: docs/quickstart.md
          - Installation: docs/installation.md
      - Core concepts:
          - Runtime model: docs/concepts/runtime.md
          - Mutation policy: docs/concepts/policy.md
          - Blast-radius scoring: docs/concepts/blast-radius.md
          - Selective recovery: docs/concepts/recovery.md
      - CLI:
          - CLI overview: docs/cli/index.md
          - Run a transaction: docs/cli/run.md
          - Inspect evidence: docs/cli/inspect.md
          - Recover safely: docs/cli/rollback.md
          - Policy commands: docs/cli/policy.md
          - Operations: docs/cli/operations.md
      - Integrations:
          - Anthropic Sandbox Runtime: docs/integrations/sandbox-runtime.md
          - MCP policy hook: docs/integrations/mcp-policy.md
          - LangChain / LangGraph: docs/integrations/langchain.md
          - Custom frameworks: docs/integrations/custom.md
      - Security & capability limits: docs/trust.md
  - SDK Reference: docs/sdk-reference.md
  - API Reference: docs/api-reference.md
  - Changelog: changelog.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            members_order: source
            docstring_style: google

markdown_extensions:
  - meta
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/landing.css
  - stylesheets/docs.css

extra_javascript:
  - javascripts/site.js
  - javascripts/docs.js

extra:
  homepage: https://kam6l.github.io/agentdiff/
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kam6l/agentdiff
      name: AgentDiff on GitHub
