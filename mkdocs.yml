site_name: AgentDiff Runtime
site_description: Runtime evidence and conflict-safe recovery for autonomous agents
site_author: kam6l
site_url: https://kam6l.github.io/agentdiff/
repo_url: https://github.com/kam6l/agentdiff
repo_name: kam6l/agentdiff
edit_uri: edit/main/docs_src/
docs_dir: docs_src
site_dir: site

copyright: Copyright &copy; 2026 AgentDiff contributors

theme:
  name: material
  language: en
  favicon: assets/images/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.path
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  custom_dir: docs_src/overrides

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Runtime Safety:
      - Runtime Model: concepts/runtime.md
      - Mutation Policy: concepts/policy.md
      - Blast-Radius Scoring: concepts/blast-radius.md
      - Selective Recovery: concepts/recovery.md
  - CLI Reference: cli.md
  - Python API: api.md
  - Integrations:
      - Anthropic Sandbox Runtime: integrations/sandbox-runtime.md
      - MCP Policy Hook: integrations/mcp-policy.md
      - Custom Frameworks: integrations/custom.md
      - LangChain / LangGraph: integrations/langchain.md
  - Legacy Evaluation:
      - Cleanliness Score: concepts/cleanliness.md
      - Side Effects: concepts/side-effects.md
      - Trajectory Tracking: concepts/trajectory.md
      - Regression Testing: tutorials/benchmarking.md
      - CI/CD Integration: tutorials/ci-cd.md
  - Project:
      - Local SafetyBench: project/safetybench.md
      - Competitive Analysis: competitive-analysis.md
      - Naming Analysis: project/naming-analysis.md
      - Contributing: contributing.md
      - Changelog: changelog.md
      - Security: https://github.com/kam6l/agentdiff/blob/main/SECURITY.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            members_order: source
            docstring_style: google

markdown_extensions:
  - meta
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/site.js

extra:
  homepage: https://kam6l.github.io/agentdiff/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kam6l/agentdiff
      name: AgentDiff on GitHub
