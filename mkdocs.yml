site_name: AgentDiff
site_description: Full-state trajectory evaluation for AI agents
site_author: kam6l
site_url: https://kam6l.github.io/agentdiff/
repo_url: https://github.com/kam6l/agentdiff
repo_name: kam6l/agentdiff
edit_uri: edit/main/docs_src/
docs_dir: docs_src
site_dir: site

copyright: Copyright &copy; 2026 AgentDiff contributors

theme:
  name: material
  language: en
  favicon: assets/images/favicon.svg
  font: false
  palette:
    scheme: default
    primary: black
    accent: deep orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - Cleanliness Score: concepts/cleanliness.md
      - Side Effects: concepts/side-effects.md
      - Trajectory Tracking: concepts/trajectory.md
  - CLI Reference: cli.md
  - Python API: api.md
  - Integrations:
      - LangChain / LangGraph: integrations/langchain.md
      - Custom Frameworks: integrations/custom.md
  - Tutorials:
      - CI/CD Integration: tutorials/ci-cd.md
      - Regression Testing: tutorials/benchmarking.md
  - Contributing: contributing.md
  - Changelog: changelog.md

plugins:
  - search
  - autorefs
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            show_root_toc_entry: false
            members_order: source
            docstring_style: google

markdown_extensions:
  - meta
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/site.js

extra:
  homepage: https://kam6l.github.io/agentdiff/
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kam6l/agentdiff
      name: AgentDiff on GitHub
