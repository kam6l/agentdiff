name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.12"
  UV_LOCKED: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  tests:
    name: Tests · ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: uv.lock

      - name: Install test dependencies
        run: uv sync --locked --group dev --python ${{ matrix.python-version }}

      - name: Run tests
        run: >-
          uv run --python ${{ matrix.python-version }} pytest
          -p no:cacheprovider tests/
          --cov=agentdiff --cov-report=term-missing --cov-report=xml

      - name: Upload reference coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-python-3.14
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  quality:
    name: Lint · types · optional integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
          cache-dependency-glob: uv.lock

      - name: Install quality and LangChain dependencies
        run: uv sync --locked --group dev --extra langchain

      - name: Check formatting
        run: uv run ruff format --check src tests examples benchmarks

      - name: Lint
        run: uv run ruff check src tests examples benchmarks

      - name: Type-check
        run: uv run mypy src/agentdiff

      - name: Exercise optional integration
        run: uv run pytest -p no:cacheprovider tests/test_integrations.py -v

  security:
    name: Security · dependencies and static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
          cache-dependency-glob: uv.lock

      - name: Install security tooling
        run: uv sync --locked --group security

      - name: Export runtime dependency graph
        run: >-
          uv export --locked --no-dev --no-emit-project --no-annotate --no-header
          --format requirements-txt --output-file /tmp/agentdiff-runtime-requirements.txt

      - name: Audit runtime dependencies
        run: >-
          uv run pip-audit --strict --progress-spinner off --disable-pip --require-hashes
          -r /tmp/agentdiff-runtime-requirements.txt

      - name: Scan Python source
        run: uv run bandit -q -r src/agentdiff -ll -ii

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
          cache-dependency-glob: uv.lock

      - name: Install documentation dependencies
        run: uv sync --locked --group docs

      - name: Build strict documentation
        env:
          PYTHONWARNINGS: "ignore::UserWarning:mkdocs_autorefs"
        run: uv run mkdocs build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mkdocs-site
          path: site/
          if-no-files-found: error
          retention-days: 7

  safetybench:
    name: Local SafetyBench
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
          cache-dependency-glob: uv.lock

      - name: Install benchmark dependencies
        run: uv sync --locked --group dev

      - name: Run adversarial local benchmark
        run: uv run python3 benchmarks/safetybench.py --output safetybench.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-safetybench
          path: safetybench.json
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package validation
    runs-on: ubuntu-latest
    needs: [tests, quality, security, docs, safetybench]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.14"
          cache-dependency-glob: uv.lock

      - name: Install build tools
        run: uv sync --locked --group build

      - name: Build source and wheel distributions
        run: uv build

      - name: Validate distribution metadata
        run: uv run twine check dist/*

      - name: Validate wheel contents
        run: uv run check-wheel-contents dist/*.whl

      - name: Smoke-test the wheel in a clean environment
        run: |
          uv venv /tmp/agentdiff-wheel --python 3.14
          uv pip install --python /tmp/agentdiff-wheel/bin/python dist/*.whl
          /tmp/agentdiff-wheel/bin/python -c "import agentdiff; print(agentdiff.__version__)"
          /tmp/agentdiff-wheel/bin/agentdiff --help
          /tmp/agentdiff-wheel/bin/agentdiff doctor --format json > /tmp/agentdiff-doctor.json
          /tmp/agentdiff-wheel/bin/agentdiff policy init --output /tmp/agentdiff.yaml
          /tmp/agentdiff-wheel/bin/agentdiff policy validate --policy /tmp/agentdiff.yaml
          /tmp/agentdiff-wheel/bin/agentdiff-demo --json > /tmp/agentdiff-demo.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
